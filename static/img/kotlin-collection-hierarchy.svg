<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Kotlin collection hierarchy in three simple families</title>
  <desc id="desc">Read-only interfaces are shown in one panel, mutable interfaces in a second, and Map separately in a third. Arrows point from a basic contract toward a more specific contract.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9ff"/><stop offset="1" stop-color="#f1fbf7"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#52647b"/>
    </marker>
    <style>
      .panel{fill:#fff;stroke:#d9e1ec;stroke-width:2}.read{fill:#edf4ff;stroke:#4674bd}.mut{fill:#e8f9f2;stroke:#078765}.map{fill:#f4edff;stroke:#7048d7}.box{stroke-width:2}.line{fill:none;stroke:#52647b;stroke-width:2.5;marker-end:url(#arrow)}.heading{font:700 22px system-ui,sans-serif;fill:#17243a;text-anchor:middle}.name{font:650 20px system-ui,sans-serif;fill:#17243a;text-anchor:middle}.note{font:15px system-ui,sans-serif;fill:#56677d;text-anchor:middle}.small{font:14px system-ui,sans-serif;fill:#56677d;text-anchor:middle}.legend{font:600 16px system-ui,sans-serif;fill:#34465d;text-anchor:middle}
    </style>
  </defs>
  <rect width="1200" height="600" rx="24" fill="url(#page)"/>
  <text class="legend" x="600" y="36">Arrow means: basic contract → more specific contract with additional capabilities</text>

  <!-- Read-only family -->
  <rect class="panel" x="35" y="65" width="410" height="500" rx="22"/>
  <text class="heading" x="240" y="105">1. Read-only interfaces</text>
  <text class="note" x="240" y="132">Callers can read, but cannot mutate through the reference</text>
  <rect class="box read" x="130" y="165" width="220" height="68" rx="14"/>
  <text class="name" x="240" y="195">Iterable&lt;T&gt;</text><text class="small" x="240" y="218">traverse elements</text>
  <path class="line" d="M240 233 V283"/>
  <rect class="box read" x="130" y="285" width="220" height="68" rx="14"/>
  <text class="name" x="240" y="315">Collection&lt;T&gt;</text><text class="small" x="240" y="338">size + membership</text>
  <path class="line" d="M240 353 V397 H140 V425"/><path class="line" d="M240 353 V397 H340 V425"/>
  <rect class="box read" x="60" y="427" width="160" height="72" rx="14"/>
  <text class="name" x="140" y="458">List&lt;T&gt;</text><text class="small" x="140" y="481">ordered + indexed</text>
  <rect class="box read" x="260" y="427" width="160" height="72" rx="14"/>
  <text class="name" x="340" y="458">Set&lt;T&gt;</text><text class="small" x="340" y="481">unique values</text>

  <!-- Mutable family -->
  <rect class="panel" x="465" y="65" width="410" height="500" rx="22"/>
  <text class="heading" x="670" y="105">2. Mutable interfaces</text>
  <text class="note" x="670" y="132">Add mutation capabilities to matching read-only contracts</text>
  <rect class="box mut" x="555" y="165" width="230" height="68" rx="14"/>
  <text class="name" x="670" y="195">MutableIterable&lt;T&gt;</text><text class="small" x="670" y="218">mutable iterator</text>
  <path class="line" d="M670 233 V283"/>
  <rect class="box mut" x="535" y="285" width="270" height="68" rx="14"/>
  <text class="name" x="670" y="315">MutableCollection&lt;T&gt;</text><text class="small" x="670" y="338">add + remove</text>
  <path class="line" d="M670 353 V397 H565 V425"/><path class="line" d="M670 353 V397 H775 V425"/>
  <rect class="box mut" x="485" y="427" width="160" height="72" rx="14"/>
  <text class="name" x="565" y="458">MutableList&lt;T&gt;</text><text class="small" x="565" y="481">also a List</text>
  <rect class="box mut" x="695" y="427" width="160" height="72" rx="14"/>
  <text class="name" x="775" y="458">MutableSet&lt;T&gt;</text><text class="small" x="775" y="481">also a Set</text>
  <text class="small" x="670" y="535">Exact cross-links are listed in the table below.</text>

  <!-- Map family -->
  <rect class="panel" x="895" y="65" width="270" height="500" rx="22"/>
  <text class="heading" x="1030" y="105">3. Map is separate</text>
  <text class="note" x="1030" y="132">Key-value container</text>
  <rect class="box map" x="930" y="205" width="200" height="72" rx="14"/>
  <text class="name" x="1030" y="237">Map&lt;K, V&gt;</text><text class="small" x="1030" y="260">unique keys</text>
  <path class="line" d="M1030 277 V367"/>
  <rect class="box map" x="915" y="370" width="230" height="72" rx="14"/>
  <text class="name" x="1030" y="402">MutableMap&lt;K, V&gt;</text><text class="small" x="1030" y="425">put + remove</text>
  <text class="small" x="1030" y="495">Map is not a Collection.</text>
  <text class="small" x="1030" y="518">Its keys, values, and entries</text>
  <text class="small" x="1030" y="539">provide collection views.</text>
</svg>
